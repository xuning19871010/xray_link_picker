name: select_xray_links
on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
# 每小时触发，上一趟未结束时排队等待，不取消旧的（串行化 RESTORE -> PROBE -> PUBLISH）
concurrency:
  group: select_xray_links
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # 恢复 sqlite：优先从本仓库 Release latest 下载并校验完整性；失败则回退未过期 Artifact。
      # 严格区分「首次引导（无 Release 且无 Artifact）」与「恢复/校验失败（拒绝静默建空库覆盖历史）」。
      - name: restore state.sqlite (release, fallback artifact, verify integrity)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p data
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 unzip curl

           check_db() {
            local f="$1"
            [ -s "$f" ] || return 1
            local res
            res=$(sqlite3 "$f" "PRAGMA quick_check;" 2>/dev/null | head -1 || true)
            [ "$res" = "ok" ]
          }

          HAS_RELEASE=0
          if gh release view latest -R "${{ github.repository }}" >/dev/null 2>&1; then
            HAS_RELEASE=1
          fi

          if [ "$HAS_RELEASE" = "1" ]; then
            if gh release download latest -R "${{ github.repository }}" -p state.sqlite -D data --clobber 2>/dev/null; then
              if check_db data/state.sqlite; then
                echo "restored and verified state.sqlite from release latest"
                ls -la data/state.sqlite
                exit 0
              fi
              echo "warn: state.sqlite from release latest failed integrity check, falling back to artifacts"
              rm -f data/state.sqlite
            else
              echo "warn: release latest has no state.sqlite or download failed, falling back to artifacts"
            fi
          fi

          AIDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-sqlite&per_page=10" \
            --jq '.artifacts[] | select(.expired==false) | .id' || true)
          if [ -n "$AIDS" ]; then
            for AID in $AIDS; do
              echo "trying artifact id=$AID"
              rm -f /tmp/state.zip data/state.sqlite
              if gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > /tmp/state.zip 2>/dev/null; then
                unzip -o /tmp/state.zip -d data || true
                if check_db data/state.sqlite; then
                  echo "restored and verified state.sqlite from artifact id=$AID"
                  ls -la data/state.sqlite
                  exit 0
                fi
              fi
            done
          fi

          if [ "$HAS_RELEASE" = "1" ] || [ -n "$AIDS" ]; then
            echo "ERROR: existing release/artifact found but all state.sqlite recovery attempts failed! Refusing to overwrite history with an empty DB."
            exit 1
          fi
          echo "initial bootstrap: no prior release or artifact found, starting with fresh state.sqlite"

      - name: setup
        env:
          RUNNER_SSH_PASSWORD: ${{ secrets.RUNNER_SSH_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip python3 sqlite3 openssh-server
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin && sudo chmod +x /usr/local/bin/xray
          # sing-box：hy2/hysteria/tuic/anytls 需要
          SB_VER=1.12.12
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-${SB_VER}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo mkdir -p /run/sshd
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/debug.conf
          echo "root:${RUNNER_SSH_PASSWORD}" | sudo chpasswd
          sudo /usr/sbin/sshd
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --url tcp://localhost:22 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          echo "CF_SSH_URL=$URL"
          echo "CF_SSH_HOST=${URL#https://}"
          echo "SSH 登录方式: cloudflared access tcp --hostname ${URL#https://} --url localhost:2222"
          echo "然后另开终端: ssh -p 2222 root@127.0.0.1"
          echo "密码: 使用仓库 Secret RUNNER_SSH_PASSWORD（即你提供的那组密码，不在日志中打印）"

      - name: select links
        env:
          PYTHONUNBUFFERED: "1"
          WORKERS_MAX: "384"
          WORKERS_MIN: "256"
          TARGET_GOOD: "0"
          DEBUG_MAX_CANDIDATES: "0"
          PROGRESS_FILE: data/progress.txt
        run: |
          set -e
          mkdir -p data
          python3 -u select_links.py &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            echo "---- $(date -u +%H:%M:%S) ----"
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            echo "CF_SSH_URL=$URL"
            tail -5 data/progress.txt 2>/dev/null || true
            uptime
            sleep 45
          done
          wait $PID

      - name: validate state.sqlite before publish
        if: always()
        run: |
          if [ -s data/state.sqlite ]; then
            sqlite3 data/state.sqlite "PRAGMA wal_checkpoint(TRUNCATE);"
            CHK=$(sqlite3 data/state.sqlite "PRAGMA quick_check;" | head -1)
            if [ "$CHK" != "ok" ]; then
              echo "ERROR: data/state.sqlite failed quick_check: $CHK"
              exit 1
            fi
            sha256sum data/state.sqlite > data/state.sqlite.sha256
          fi

      # Artifact 保留作备份（30 天）：Release 附件被覆盖坏了时还能回退恢复
      - name: upload state.sqlite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-sqlite
          path: |
            data/state.sqlite
            data/state.sqlite.sha256
          retention-days: 30
          if-no-files-found: warn

      # 发布结果到本仓库固定 Release（tag latest）
      - name: publish good/stable and IP reports to release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la data/good_links.txt data/stable_links.txt data/stable_links_by_ip.txt \
            data/ip_day_counts.csv data/ip_summary.csv data/collection_days.csv \
            data/ip_report.html data/state.sqlite
          NOTE="自动更新于 $(TZ=Asia/Shanghai date '+%F %T') 北京时间；run #${{ github.run_number }}"
          if ! gh release view latest -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create latest -R "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "latest good/stable links" --notes "$NOTE" --latest
          fi
          # GitHub 拒绝 0 字节 Release 附件（HTTP 400 Bad Content-Length）。
          # 空文件自动跳过，其余附件覆盖上传。
          assets=()
          for f in \
            data/good_links.txt \
            data/stable_links.txt \
            data/stable_links_by_ip.txt \
            data/ip_day_counts.csv \
            data/ip_summary.csv \
            data/collection_days.csv \
            data/ip_report.html \
            data/state.sqlite \
            data/state.sqlite.sha256; do
            if [ ! -s "$f" ]; then
              echo "skip empty release asset: $f"
              continue
            fi
            assets+=("$f")
          done
          gh release upload latest "${assets[@]}" --clobber -R "${{ github.repository }}"
          gh release edit latest -R "${{ github.repository }}" --notes "$NOTE"
