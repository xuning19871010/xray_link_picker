name: select_xray_links
on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
# 每小时触发，上一趟未结束时排队等待，不取消旧的
concurrency:
  group: select_xray_links
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # 从本仓（xuning）上一份 Artifact 恢复 sqlite；不进 git，也不双推
      - name: restore state.sqlite artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p data
          AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-sqlite&per_page=5" \
            --jq '[.artifacts[] | select(.expired==false)][0].id // empty')
          if [ -z "$AID" ]; then echo "no prior state artifact"; exit 0; fi
          echo "restoring artifact id=$AID"
          gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > /tmp/state.zip
          unzip -o /tmp/state.zip -d data
          ls -la data/state.sqlite || true

      - name: setup
        env:
          RUNNER_SSH_PASSWORD: ${{ secrets.RUNNER_SSH_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip python3 openssh-server
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin && sudo chmod +x /usr/local/bin/xray
          # sing-box：hy2/hysteria/tuic/anytls 需要
          SB_VER=1.12.12
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-${SB_VER}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo mkdir -p /run/sshd
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/debug.conf
          echo "root:${RUNNER_SSH_PASSWORD}" | sudo chpasswd
          sudo /usr/sbin/sshd
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --url tcp://localhost:22 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          echo "CF_SSH_URL=$URL"
          echo "CF_SSH_HOST=${URL#https://}"
          echo "SSH 登录方式: cloudflared access tcp --hostname ${URL#https://} --url localhost:2222"
          echo "然后另开终端: ssh -p 2222 root@127.0.0.1"
          echo "密码: 使用仓库 Secret RUNNER_SSH_PASSWORD（即你提供的那组密码，不在日志中打印）"

      - name: select links
        env:
          PYTHONUNBUFFERED: "1"
          WORKERS_MAX: "384"
          WORKERS_MIN: "256"
          TARGET_GOOD: "0"
          DEBUG_MAX_CANDIDATES: "0"
          PROGRESS_FILE: data/progress.txt
        run: |
          set -e
          mkdir -p data
          python3 -u select_links.py &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            echo "---- $(date -u +%H:%M:%S) ----"
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            echo "CF_SSH_URL=$URL"
            tail -5 data/progress.txt 2>/dev/null || true
            uptime
            sleep 45
          done
          wait $PID

      # sqlite 只上传 Artifact（单仓 xuning），不进 git
      - name: upload state.sqlite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-sqlite
          path: data/state.sqlite
          retention-days: 30
          if-no-files-found: warn

      - name: commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交 txt 等文本结果；sqlite 已 gitignore
          git add data/*.txt data/.gitkeep 2>/dev/null || git add data/
          git diff --cached --quiet && echo no_changes && exit 0
          git commit -m "[action] bot 自动更新 data/good_links.txt 与 data/stable_links.txt"
          git push
